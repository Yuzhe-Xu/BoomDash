<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07080d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>BOOMDASH // FLIGHT CONTROL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <div id="letterbox">
        <div id="stage">
          <canvas id="game" aria-label="BoomDash game canvas"></canvas>

          <header id="hud-top">
            <div class="hud-row">
              <div class="hud-cluster">
                <span id="level-tag">SECTOR 01</span>
                <span id="hud-stat">BOMBS 0/5</span>
              </div>
              <div class="hud-cluster right">
                <button id="btn-mute" class="icon-btn" type="button" aria-label="mute">
                  SND
                </button>
                <button id="btn-pause" class="icon-btn" type="button" aria-label="pause">
                  II
                </button>
              </div>
            </div>
            <div id="hud-ship" hidden>
              <span id="hud-speed">V 0</span>
              <span id="hud-min">MIN 0</span>
            </div>
          </header>

          <div id="bomb-rail" hidden></div>

          <footer id="hud-bottom">
            <div id="planning-bar">
              <button id="btn-clear" type="button">CLEAR</button>
              <button id="btn-delete" type="button">DEL</button>
              <button id="btn-launch" class="primary" type="button">LAUNCH</button>
            </div>
          </footer>

          <aside id="debug" hidden></aside>

          <section id="pause-menu" class="overlay" hidden>
            <div class="panel">
              <p class="panel-kicker">SYSTEM</p>
              <h2>PAUSED</h2>
              <p id="pause-copy" class="panel-copy">Simulation frozen.</p>
                <div class="panel-actions">
                  <button id="btn-resume" class="primary" type="button">RESUME</button>
                  <button id="btn-pause-retry" type="button">RETRY</button>
                  <button id="btn-pause-redeploy" type="button">REDEPLOY</button>
                  <button id="btn-pause-menu" type="button">MAIN MENU</button>
                </div>
            </div>
          </section>

          <section id="start-screen" class="overlay">
            <div class="panel start-panel">
              <div id="start-home">
                <p class="panel-kicker">NAVIGATION SYSTEM</p>
                <h1>BOOMDASH</h1>
                <p class="panel-copy">SECTOR RUN // FLIGHT CONTROL</p>
                <div class="panel-actions">
                  <button id="btn-start" class="primary" type="button">START</button>
                  <button id="btn-sectors" type="button">SECTORS</button>
                </div>
              </div>
              <div id="sector-select" hidden>
                <p class="panel-kicker">MISSION SELECT</p>
                <h2>SECTORS</h2>
                <div id="sector-list" class="sector-list"></div>
                <button id="btn-sectors-back" type="button">BACK</button>
              </div>
            </div>
          </section>

          <section id="tutorial" class="overlay" hidden>
            <div class="panel tutorial-panel">
              <p id="tutorial-kicker" class="panel-kicker">OBJECTIVE</p>
              <h2 id="tutorial-title">游戏目标</h2>
              <div id="tutorial-stage" class="tutorial-stage">
                <article class="tutorial-slide is-active" data-page="0">
                  <div class="tutorial-anim anim-goal" aria-hidden="true">
                    <div class="tut-stars"><i></i><i></i><i></i><i></i><i></i><i></i></div>
                    <div class="tut-goal"></div>
                    <div class="tut-craft">
                      <i class="tut-flame"></i>
                      <i class="tut-ship"></i>
                    </div>
                    <div class="tut-time"><span>TIME LIMIT</span><b><i></i></b></div>
                    <div class="tut-badge">LINK STABLE</div>
                  </div>
                </article>
                <article class="tutorial-slide" data-page="1">
                  <div class="tutorial-anim anim-deploy" aria-hidden="true">
                    <div class="tut-stars"><i></i><i></i><i></i><i></i><i></i><i></i></div>
                    <div class="tut-goal"></div>
                    <div class="tut-path"></div>
                    <div class="tut-craft idle">
                      <i class="tut-ship"></i>
                    </div>
                    <div class="tut-bomb bomb-a"><span>1</span></div>
                    <div class="tut-bomb bomb-b"><span>2</span></div>
                    <div class="tut-ring ring-a"></div>
                    <div class="tut-ring ring-b"></div>
                    <div class="tut-tap tap-a"></div>
                    <div class="tut-tap tap-b"></div>
                    <div class="tut-cursor"></div>
                  </div>
                </article>
                <article class="tutorial-slide" data-page="2">
                  <div class="tutorial-anim anim-flight" aria-hidden="true">
                    <div class="tut-stars"><i></i><i></i><i></i><i></i><i></i><i></i></div>
                    <div class="tut-goal"></div>
                    <div class="tut-flash"></div>
                    <div class="tut-bomb bomb-a armed"><span>1</span></div>
                    <div class="tut-blast"></div>
                    <div class="tut-craft">
                      <i class="tut-flame"></i>
                      <i class="tut-ship"></i>
                    </div>
                    <div class="tut-time"><span>TIME LIMIT</span><b><i></i></b></div>
                    <div class="tut-badge">LINK STABLE</div>
                  </div>
                </article>
              </div>
              <p id="tutorial-copy" class="panel-copy">在规定时间内使飞船进入终点区域。</p>
              <div id="tutorial-dots" class="tutorial-dots"></div>
              <div class="panel-actions">
                <button id="btn-tutorial-next" class="primary" type="button">NEXT</button>
                <button id="btn-tutorial-prev" type="button" hidden>BACK</button>
                <button id="btn-tutorial-skip" type="button">SKIP</button>
              </div>
            </div>
          </section>

          <section id="result" class="overlay" hidden>
            <div class="panel">
              <p id="result-kicker" class="panel-kicker">RESULT</p>
              <h2 id="result-title">SUCCESS</h2>
              <p id="result-copy" class="panel-copy"></p>
              <dl id="result-stats"></dl>
              <div class="panel-actions">
                <button id="btn-retry" type="button">RETRY</button>
                <button id="btn-redeploy" class="primary" type="button">REDEPLOY</button>
                <button id="btn-next" class="primary" type="button" hidden>NEXT SECTOR</button>
                <button id="btn-result-sectors" type="button">SECTORS</button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
